services:
  # ─── FRONTEND PHP-FPM ────────────────────────────────────────────────────────
  php-front:
    image: php:8.2-fpm-alpine
    container_name: myapp_front
    restart: unless-stopped
    ports:
      - "127.0.0.1:9001:9000" # Le Nginx global enverra le trafic web ici
    volumes:
      - ./php-front:/var/www/html
    networks:
      - myapp_net

  # ─── API Node.js & Prisma ───────────────────────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: myapp_api
    restart: unless-stopped
    ports:
      - "127.0.0.1:9002:3000" # Optionnel : si tu as besoin d'y accéder en direct via le proxy
    volumes:
      - ./api:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - NODE_ENV=production
      - DATABASE_URL=mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD}@mongo:27017/${MONGO_DB:-myapp}?authSource=admin
    depends_on:
      - mongo
    networks:
      - myapp_net

  # ─── Base de données MongoDB ──────────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: myapp_mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Définir MONGO_PASSWORD dans .env}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-myapp}
    networks:
      - myapp_net

volumes:
  mongo_data:

networks:
  myapp_net:
    driver: bridge
