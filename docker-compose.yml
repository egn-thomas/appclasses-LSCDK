services:
  mongo:
    image: mongo:7
    container_name: appclasses-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    volumes:
      - mongo_data:/data/db
    networks:
      - default

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: appclasses-api
    restart: unless-stopped
    ports:
      - "${API_PORT}:3000"
    networks:
      - default
      - proxy-network
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${API_PORT}
      MONGO_URI: ${MONGO_URI}
      MONGO_DB: ${MONGO_DB}
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      FRONT_URL: ${FRONT_URL}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      - mongo

  php:
    build:
      context: ./php
      dockerfile: Dockerfile
    container_name: appclasses-php
    restart: unless-stopped
    ports:
      - "${PHP_PORT}:80"
    volumes:
      - ./php:/var/www/html
    networks:
      - default # <--- On s'assure qu'il reste dans le même réseau que l'API
    environment:
      API_URL: ${API_URL}
    depends_on:
      - api

volumes:
  mongo_data:
  
networks:
  default: # <--- On définit explicitement le réseau par défaut de ce compose
  proxy-network:
    external: true
