services:

  # ─── Reverse proxy + HTTPS ───────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./app:/var/www/html:ro                  # ton code PHP/JS
      - certbot_www:/var/www/certbot:ro          # challenge Let's Encrypt
      - certbot_certs:/etc/letsencrypt:ro        # certificats SSL
    depends_on:
      - php
    networks:
      - webnet

  # ─── PHP-FPM ──────────────────────────────────────────────────────────────────
  php:
    build:
      context: ./php
      dockerfile: Dockerfile
    container_name: php
    restart: unless-stopped
    volumes:
      - ./app:/var/www/html                      # même code que nginx
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - MONGO_DB=${MONGO_DB:-myapp}
    depends_on:
      - mongo
    networks:
      - webnet

  # ─── MongoDB ──────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Définir MONGO_PASSWORD dans .env}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-myapp}
    networks:
      - webnet
    # ⚠️ Ne PAS exposer le port 27017 en production
    # ports:
    #   - "27017:27017"

  # ─── Certbot (renouvellement SSL) ────────────────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    # Lance manuellement : docker compose run certbot certonly ...
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  mongo_data:
  certbot_www:
  certbot_certs:

networks:
  webnet:
    driver: bridge
