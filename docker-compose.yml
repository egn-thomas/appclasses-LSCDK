services:
  mongo:
    image: mongo:7
    container_name: appclasses-mongo
    restart: unless-stopped
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-change_me_strong_password}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-appclasses}
    volumes:
      - mongo_data:/data/db

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: appclasses-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      MONGO_URI: ${MONGO_URI:-mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-change_me_strong_password}@mongo:27017/${MONGO_DB:-appclasses}?authSource=admin}
      MONGO_DB: ${MONGO_DB:-appclasses}
    depends_on:
      - mongo

  php:
    build:
      context: ./php
      dockerfile: Dockerfile
    container_name: appclasses-php
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./php:/var/www/html
    environment:
      API_URL: ${API_URL:-http://localhost:3000}
    depends_on:
      - api

volumes:
  mongo_data:
