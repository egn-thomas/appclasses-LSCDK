services:
  mongo:
    image: mongo:7
    container_name: appclasses-mongo-dev
    ports:
      - "${MONGO_PORT}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    volumes:
      - mongo_data_dev:/data/db

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: appclasses-api-dev
    ports:
      - "${API_PORT}:3000"
    volumes:
      - ./api:/usr/src/app:delegated
      - /usr/src/app/node_modules
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${API_PORT}
      MONGO_URI: ${MONGO_URI}
      MONGO_DB: ${MONGO_DB}
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      FRONT_URL: ${FRONT_URL}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    command: sh -c "npm install --silent && npm run dev"
    depends_on:
      - mongo

  php:
    build:
      context: ./php
      dockerfile: Dockerfile
    container_name: appclasses-php-dev
    ports:
      - "${PHP_PORT}:80"
    volumes:
      - ./php:/var/www/html:delegated
    environment:
      API_URL: ${API_URL}
    depends_on:
      - api

volumes:
  mongo_data_dev:
