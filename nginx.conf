# Configuration nginx pour le reverse proxy
# À adapter selon votre infrastructure

upstream php_backend {
    server php:80;
}

upstream api_backend {
    server api:3000;
}

# Redirection HTTP vers HTTPS
server {
    listen 80;
    server_name appclasses.lscdk.fr;
    return 301 https://$server_name$request_uri;
}

# Configuration HTTPS
server {
    listen 443 ssl http2;
    server_name appclasses.lscdk.fr;

    # Certificats SSL (à adapter selon votre configuration)
    ssl_certificate /etc/nginx/certs/appclasses.lscdk.fr.crt;
    ssl_certificate_key /etc/nginx/certs/appclasses.lscdk.fr.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 50M;

    # Proxier les requêtes /api/* vers le backend API
    location /api/ {
        proxy_pass http://api_backend/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxier tout le reste vers le backend PHP
    location / {
        proxy_pass http://php_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
