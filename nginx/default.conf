# nginx/default.conf
# ─── Redirection HTTP → HTTPS ─────────────────────────────────────────────────
server {
    listen 80;
    server_name ton-domaine.fr www.ton-domaine.fr;

    # Nécessaire pour le challenge Certbot (Let's Encrypt)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── Serveur principal HTTPS ──────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name ton-domaine.fr www.ton-domaine.fr;

    root /var/www/html;
    index index.php index.html;

    # Certificats Let's Encrypt (générés par Certbot)
    ssl_certificate     /etc/letsencrypt/live/ton-domaine.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ton-domaine.fr/privkey.pem;

    # Sécurité SSL moderne
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    # Headers sécurité
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Assets statiques JS/CSS/images — servis directement par Nginx
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # PHP — transmis à PHP-FPM
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass php:9000;           # conteneur php, port FPM
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 30;
    }

    # Routing propre (ex: API REST en PHP)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Bloquer l'accès aux fichiers sensibles
    location ~ /\.(env|git|htaccess) {
        deny all;
    }
}
